[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pec-fuse"
version = "0.2.0"
description = "Source-preserving evidence fusion for candidate-level ranking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
figures = [
  "matplotlib>=3.8",
  "fonttools>=4.0",
  "svglib>=2.0",
  "reportlab>=4.0",
]
neural = [
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
